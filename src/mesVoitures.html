<!DOCTYPE html>
<html lang="fr">
<head>
    <title>Mes voitures - TFE</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta property="og:site_name" content="TFE De Scheerder Jarne">
    <meta property="og:title" content="Les secrets de la voiture">
    <meta property="og:description" content="TFE De Scheerder Jarne">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jarnedescheerder.be/projets/tfe">
    <meta property="og:image" content="https://jarnedescheerder.be/projets/tfe/public/favico.ico">
    <meta property="og:image:width" content="1800">
    <meta property="og:image:height" content="945">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <link rel="stylesheet" href="/styles/app.scss">
    <script type="module" src="scripts/app.js" defer></script>
</head>
<body class="selection__body" id="selection">
    <nav class="menu">
        <button class="menu__btn NAV">Menu</button>
        <ul class="menu__ul">
            <li><a href="index.html" class="btnLiens NAV"><img src="accueilIcone.png" class="icone" alt="icone Accueil">Accueil</a></li>
            <li><a href="diagnostiques.html" class="btnLiens NAV"><img src="diagnostiquesIcone.png" class="icone" alt="icone Diagnostiques">Diagnostiques</a></li>
            <li><a href="entretien.html" class="btnLiens NAV"><img src="EntretienIcone.png" class="icone" alt="icone Entretien">Entretien</a></li>
            <li><a href="#" class="btnLiens NAV menuActive"><img src="mesVoituresIcone.png" class="icone" alt="icone Mes voitures">Mes voitures</a></li>
        </ul>
    </nav>
    <section class="mesVoitures section__btnRetour">
        <button onclick="window.location.href='index.html'" class="btnRetour" style="margin-bottom: 46px;">←&nbsp;Retour&nbsp;vers&nbsp;Accueil</button>
        <h1>Gérer vos voitures</h1>
        <div class="form__accueil">
            <div class="form__elements">
                <h2 class="color--black">Nouvelle voiture&nbsp;:</h2>
                <div class="form">
                    <label for="MVoiture">Marque de la voiture :</label>
                    <input type="text" id="MVoiture" name="marqueVoiture" placeholder="Marque">
                </div>
                <div class="form">
                    <label for="typeVoiture">Type de voiture :</label>
                    <!-- Toutes les catégories sont actives pour que les gens puissent mettre leurs voiture dedans même s'il n'y a pas encore de trajet personnalisé pour son véhicule -->
                    <div class="select-wrapper">
                        <select id="typeVoiture" name="typeVoiture">
                            <option value="">Sélectionner un type</option>
                            <option value="essence">Essence</option>
                            <option value="diesel">Diesel</option>
                            <option value="mhev">MHEV</option>
                            <option value="hev">HEV</option>
                            <option value="phev">PHEV</option>
                            <option value="electrique">Électrique</option>
                        </select>
                    </div>
                </div>
                <button id="ajouterVoiture">Ajouter la voiture</button>
            </div>
            <div class="voituresEnregistrees">
                <h2 class="color--black">Voitures enregistrées&nbsp;:</h2>
                <div id="listeVoitures"></div>
            </div>
        </div>
    </section>
    <section id="mesVoitures__problemes">
        <div class="problemesListe">
            <h2>Quel problème rencontrez-vous avec votre <b class="voitureSelectionner h2"></b> ?</h2>
            <div class="mesVoituresProblemes__form">
                <div class="problemesSelection">
                    <select id="typeProbleme" name="typeProbleme">
                        <option value="">Sélectionner un type de problème</option>
                        <option value="moteur">Problème moteur</option>
                        <option value="electrique">Problème électrique</option>
                        <option value="chassis">Problème châssis</option>
                        <option value="pneus">Problème pneus</option>
                        <option value="freins">Problème freins</option>
                        <option value="peinture">Problème peinture</option>
                    </select>
                </div>
                <div class="problemesSelection__txt">
                    <label for="Description" class="h3">Description :</label>
                    <textarea id="Description" name="Description" placeholder="Description du problème"></textarea>
                </div>
                <button id="ajouterProbleme">Ajouter ce problème</button>
            </div>
        </div>
        <div>
            <h2>Liste des problèmes connus avec votre <b class="voitureSelectionner h2"></b> :</h2>
            <table class="probleme__item" id="tableProblemes">
                <thead>
                    <tr>
                        <th></th>
                        <th class="h3">Type de problème</th>
                        <th class="h3">Description</th>
                        <th class="h3">Status</th>
                    </tr>
                </thead>
                <tbody id="listeProblemesConnus"></tbody>
            </table>
        </div>
    </section>
</body>
</html>
